<div class="modal-overlay" (click)="cerrar()">
    <div
        #dialogo
        class="modal-container"
        role="dialog"
        aria-modal="true"
        aria-labelledby="titulo-contacto"
        (click)="$event.stopPropagation()"
    >
        <div class="modal-header">
            <h3 id="titulo-contacto">Contáctanos</h3>
            <button type="button" class="close-btn" aria-label="Cerrar" (click)="cerrar()">&times;</button>
        </div>
        <div class="modal-body">
            <form #contactForm="ngForm" (ngSubmit)="enviarFormulario(contactForm)">
                <label class="campo">
                    <span>Nombre</span>
                    <input #primerCampo type="text" name="nombre" placeholder="Nombre" ngModel required>
                </label>
                <label class="campo">
                    <span>Email</span>
                    <input type="email" name="email" placeholder="Email" ngModel required>
                </label>
                <label class="campo">
                    <span>Teléfono</span>
                    <input type="tel" name="telefono" placeholder="Teléfono" ngModel>
                </label>
                <label class="campo">
                    <span>WhatsApp</span>
                    <input type="text" name="whatsapp" placeholder="WhatsApp" ngModel>
                </label>
                <label class="campo">
                    <span>Mensaje</span>
                    <textarea name="mensaje" placeholder="Mensaje" ngModel required></textarea>
                </label>
                <button type="submit" class="btn-primary">Enviar mensaje</button>
            </form>
            @if (enviado) {
            <p class="exito" role="status">¡Mensaje enviado con éxito! (simulado)</p>
            }
        </div>
    </div>
</div>
